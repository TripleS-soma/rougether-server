spring:
  application:
    name: rougether-user-api
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  # 프로필 사진 업로드. 10MB 규칙은 서비스 검증(MEMBER_PROFILE_IMAGE_INVALID)이 담당하므로
  # 컨테이너 한도는 그보다 여유 있게 잡는다. 이 한도(12MB)를 넘는 요청은 컨트롤러 진입 전에
  # MaxUploadSizeExceededException → FILE_TOO_LARGE(400)로 매핑된다.
  servlet:
    multipart:
      max-file-size: 12MB
      # 버그 제보 스크린샷 최대 3장 x 10MB 를 수용 (#213). 파일당 상한은 12MB 유지.
      max-request-size: 34MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:local-dev-only-secret-change-in-prod-hs256-needs-32-bytes-min}
  access-ttl: 30m
  refresh-ttl: 14d

kakao:
  api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
  app-id: ${KAKAO_APP_ID:1501738}
  # 회원탈퇴 시 서버-투-서버 unlink용 Admin key. 미설정이면 unlink 호출이 502로 실패함(fail-closed).
  admin-key: ${KAKAO_ADMIN_KEY:}

google:
  allowed-client-ids: ${GOOGLE_ALLOWED_CLIENT_IDS:499923665503-f2l1b05h9q48f4lda8reh65d9hdh1jfo.apps.googleusercontent.com,499923665503-b1brsuooa940tjrs8vapo4dl2m8mri19.apps.googleusercontent.com,437063052004-99kq37m58jcj7nakm9uhottgskphob95.apps.googleusercontent.com}
  certs-url: ${GOOGLE_CERTS_URL:https://www.googleapis.com/oauth2/v3/certs}

apple:
  allowed-client-ids: ${APPLE_ALLOWED_CLIENT_IDS:com.triples.rougether}
  keys-url: ${APPLE_KEYS_URL:https://appleid.apple.com/auth/keys}
  # 토큰 교환·revoke의 client_secret(ES256 JWT) 서명용 시크릿. 미설정이면 애플 로그인·revoke가 502로 실패함(fail-closed).
  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key: ${APPLE_PRIVATE_KEY:}
  # apple refresh token 저장 암호화 키. 커밋된 기본 키로 조용히 암호화하지 않도록 기본값을 두지 않음.
  refresh-token-enc-key: ${APPLE_REFRESH_TOKEN_ENC_KEY:}

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

operations:
  webex:
    bot-token: ${OPERATIONS_WEBEX_BOT_TOKEN:}
    room-id: ${OPERATIONS_WEBEX_ROOM_ID:}
    environment: ${ROUGETHER_ENVIRONMENT:dev}
    cooldown: ${OPERATIONS_WEBEX_COOLDOWN:PT1M}
    oauth-invalid-token-cooldown: ${OPERATIONS_WEBEX_OAUTH_INVALID_TOKEN_COOLDOWN:PT1H}

asset:
  s3:
    bucket: rougether-assets
    region: ap-northeast-2
    purge-versions-on-delete: ${ASSET_S3_PURGE_VERSIONS:false}

# 캘린더 임포트 유사 루틴·투두 비교(#303). threshold 이상 코사인만 유사로 채택.
# 0.50 은 text-embedding-3-large/1024 로 한글 제목 쌍 30개 실측한 값 — 무관 쌍 최고 0.436, 유사 쌍은 0.57 이상에 몰려 그 중앙.
# (약어·동의어 "헬스/PT"·"러닝/조깅"은 어느 값으로도 못 잡음 → 후속 LLM 판정 후보)
routine:
  similarity:
    threshold: ${ROUTINE_SIMILARITY_THRESHOLD:0.50}

# OpenAI 호환 LLM/임베딩(infra:llm). api-key 가 비면 stub 이 떠서 유사도 API 는 정규화 일치만으로 동작(fail-open)
llm:
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  api-key: ${LLM_API_KEY:}
  timeout: ${LLM_TIMEOUT:30s}
  embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-3-large}
  embedding-dimensions: ${LLM_EMBEDDING_DIMENSIONS:1024}

# 사용자에게 노출할 게시 승인 집 커버 manifest. S3 house/ 전체 목록과 분리함.
house:
  cover-images:
    items:
      - code: cloud_balloon
        name: 구름 풍선 집
        cover-image-key: house/cloud-balloon/house-unified-cloud-balloon-frame.png
      - code: coral_aquarium
        name: 산호 수족관 집
        cover-image-key: house/coral-aquarium/house-unified-coral-aquarium-frame.png
      - code: mushroom_forest
        name: 버섯 숲 집
        cover-image-key: house/mushroom-forest/house-unified-mushroom-forest-frame.png
      - code: night_observatory
        name: 밤의 천문대 집
        cover-image-key: house/night-observatory/house-unified-night-observatory-frame-v3.png

# 규칙 기반 동거 봇(#307). true 면 기동 시 봇 6명을 카탈로그와 동기화한다.
# 기본 false — 격리(#308)·활동 스케줄러(#310)가 머지된 뒤 배포 환경에서 ROUGETHER_BOTS_ENABLED=true 로 켠다.
rougether:
  bots:
    enabled: ${ROUGETHER_BOTS_ENABLED:false}
