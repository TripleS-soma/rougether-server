dependencies {
    implementation project(':common')
    implementation project(':furniture-preprocessing')
    implementation platform('software.amazon.awssdk:bom:2.31.0')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:lambda'
    implementation 'software.amazon.awssdk:apache-client'
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'tools.jackson.core:jackson-databind'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.register('buildZip', Zip) {
    def nativeDir = providers.gradleProperty('vipsNativeDir').map { file(it) }.orElse(file('native'))
    archiveFileName = project.name + '.zip'
    into('lib') { from tasks.jar; from configurations.runtimeClasspath }
    into('native') { from nativeDir; include 'libvips-cpp.so.8.18.6' }
    into('native/licenses') {
        from nativeDir.map { it.parentFile }
        include 'README.md', 'package.json', 'versions.json'
    }
    from('src/main/resources/bootstrap-wrapper') { filePermissions { unix('rwxr-xr-x') } }
    doFirst {
        def binary = new File(nativeDir.get(), 'libvips-cpp.so.8.18.6')
        if (!binary.isFile()) {
            throw new GradleException('검증한 Linux arm64 libvips 디렉터리를 -PvipsNativeDir로 지정해야 함')
        }
        def sha256 = java.security.MessageDigest.getInstance('SHA-256').digest(binary.bytes).encodeHex().toString()
        if (sha256 != '264d3092d69de80f5acdb71c930efec8db5bd9627f41659ed3416566b9ae34b4') {
            throw new GradleException('검증한 sharp-libvips-linux-arm64 1.3.3 바이너리와 SHA-256이 다름')
        }
        ['README.md', 'package.json', 'versions.json'].each { notice ->
            if (!new File(nativeDir.get().parentFile, notice).isFile()) {
                throw new GradleException("네이티브 출처 및 라이선스 파일 누락: ${notice}")
            }
        }
    }
}
