name: PR Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-bot-test:
    name: Review bot unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s .github/review-bot/tests -v

  verify:
    uses: ./.github/workflows/backend-verify.yml

  test:
    # 기존 필수 검사 이름을 유지하며 모든 분할과 이미지 생성의 성공을 확인함.
    name: Gradle test
    if: always()
    needs: [verify, review-bot-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require complete backend verification
        env:
          VERIFICATION: ${{ needs.verify.result }}
          REVIEW_TESTS: ${{ needs.review-bot-test.result }}
        run: test "$VERIFICATION" = success && test "$REVIEW_TESTS" = success
