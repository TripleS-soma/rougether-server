name: Docker ECR Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: rougether-dev-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::478572912668:role/rougether-dev-github-actions-deploy
  ECR_REPOSITORY_PREFIX: rougether-dev
  IMAGE_TAG: dev
  DEPLOYMENT_ENVIRONMENT: dev
  FIREBASE_CREDENTIALS_PARAMETER: /rougether-dev/firebase/credentials-json
  WEBEX_BOT_TOKEN_PARAMETER: /rougether-dev/alerts/webex-bot-token
  WEBEX_ROOM_ID_PARAMETER: /rougether-dev/alerts/webex-room-id

jobs:
  test:
    name: Gradle test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

  build:
    name: Build and push ${{ matrix.module }}
    runs-on: ubuntu-latest
    # test 와 병렬 실행(벽시계 -3분). 게이트는 deploy 의 needs: [test, build] 가 유지한다 —
    # 여기서는 :unverified-<sha> 만 push 한다. ":sha = 테스트 통과" 불변식을 지키기 위해
    # :sha 승격은 test 통과 후 deploy 가, 부트스트랩이 쓰는 :dev 승격은 배포 검증 후 deploy 가 수행한다.
    strategy:
      matrix:
        include:
          - module: user-api
            repository: user-api
          - module: admin-api
            repository: admin-api
          - module: batch
            repository: batch

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push linux/amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          build-args: |
            APP_MODULE=${{ matrix.module }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_PREFIX }}/${{ matrix.repository }}:unverified-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.module }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}-amd64

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    # test 와 build 가 모두 성공해야 배포·:dev 승격이 일어난다 (병렬화의 게이트)
    needs: [test, build]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync Webex alert configuration to SSM
        shell: bash
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_ROOM_ID: ${{ vars.WEBEX_ROOM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$WEBEX_BOT_TOKEN" ] || [[ "$WEBEX_BOT_TOKEN" =~ [[:space:]] ]]; then
            echo "::warning::WEBEX_BOT_TOKEN is missing or invalid; keeping the existing SSM value"
          else
            aws ssm put-parameter \
              --name "$WEBEX_BOT_TOKEN_PARAMETER" \
              --type SecureString \
              --value "$WEBEX_BOT_TOKEN" \
              --description "Rougether Webex operational-alert bot token" \
              --overwrite \
              --no-cli-pager >/dev/null
          fi

          if [ -z "$WEBEX_ROOM_ID" ] || [[ "$WEBEX_ROOM_ID" =~ [[:space:]] ]]; then
            echo "::warning::WEBEX_ROOM_ID is missing or invalid; keeping the existing SSM value"
          else
            aws ssm put-parameter \
              --name "$WEBEX_ROOM_ID_PARAMETER" \
              --type String \
              --value "$WEBEX_ROOM_ID" \
              --description "Rougether Webex operational-alert room ID" \
              --overwrite \
              --no-cli-pager >/dev/null
          fi

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ":sha = 테스트+빌드 게이트 통과" 불변식 — build 는 :unverified-<sha> 만 push 하므로,
      # test 와 build 가 모두 성공한 여기서만 :sha 가 생긴다 (manifest 복사, 수 초).
      # 이후 배포·롤백·수동 배포는 전부 검증된 :sha 만 바라본다.
      - name: Promote tested images to :sha
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          SOURCE_TAG: unverified-${{ github.sha }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash .github/scripts/promote-ecr-dev-tags.sh user-api admin-api batch

      - name: Discover running EC2 instance
        id: ec2
        shell: bash
        run: |
          set -euo pipefail

          aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=rougether-dev-app" "Name=instance-state-name,Values=running" \
            --output json > instances.json

          instance_id="$(jq -r '[.Reservations[].Instances[]] | sort_by(.LaunchTime) | .[-1].InstanceId // empty' instances.json)"
          public_ip="$(jq -r '[.Reservations[].Instances[]] | sort_by(.LaunchTime) | .[-1].PublicIpAddress // empty' instances.json)"

          if [ -z "$instance_id" ] || [ "$instance_id" = "null" ]; then
            echo "No running rougether-dev-app EC2 instance found" >&2
            exit 1
          fi

          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
          echo "public_ip=$public_ip" >> "$GITHUB_OUTPUT"

      - name: Restart containers through SSM
        shell: bash
        env:
          WEBEX_ROOM_ID: ${{ vars.WEBEX_ROOM_ID }}
        run: |
          set -euo pipefail

          if [ -z "$WEBEX_ROOM_ID" ] || [[ "$WEBEX_ROOM_ID" =~ [[:space:]] ]]; then
            echo "::warning::WEBEX_ROOM_ID is missing or invalid; keeping the existing runtime value"
            WEBEX_ROOM_ID=""
          fi

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          user_image="${registry}/${ECR_REPOSITORY_PREFIX}/user-api:${GITHUB_SHA}"
          admin_image="${registry}/${ECR_REPOSITORY_PREFIX}/admin-api:${GITHUB_SHA}"
          batch_image="${registry}/${ECR_REPOSITORY_PREFIX}/batch:${GITHUB_SHA}"

          deploy_script="$(
            sed \
              -e "s|__AWS_REGION__|${AWS_REGION}|g" \
              -e "s|__REGISTRY__|${registry}|g" \
              -e "s|__USER_IMAGE__|${user_image}|g" \
              -e "s|__ADMIN_IMAGE__|${admin_image}|g" \
              -e "s|__BATCH_IMAGE__|${batch_image}|g" \
              -e "s|__DEPLOYED_SHA__|${GITHUB_SHA}|g" \
              -e "s|__FIREBASE_PARAMETER_NAME__|${FIREBASE_CREDENTIALS_PARAMETER}|g" \
              -e "s|__WEBEX_BOT_TOKEN_PARAMETER_NAME__|${WEBEX_BOT_TOKEN_PARAMETER}|g" \
              -e "s|__WEBEX_ROOM_ID__|${WEBEX_ROOM_ID}|g" \
              -e "s|__ENVIRONMENT__|${DEPLOYMENT_ENVIRONMENT}|g" \
              .github/scripts/deploy-ec2-with-rollback.sh
          )"
          script="$(printf "bash -se <<'ROUGETHER_DEPLOY_SCRIPT'\n%s\nROUGETHER_DEPLOY_SCRIPT\n" "$deploy_script")"

          params="$(jq -n --arg script "$script" '{commands: [$script]}')"
          command_id="$(
            aws ssm send-command \
              --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
              --document-name AWS-RunShellScript \
              --comment "Deploy rougether images from GitHub Actions ${GITHUB_SHA}" \
              --parameters "$params" \
              --query 'Command.CommandId' \
              --output text
          )"

          status="Pending"
          for i in $(seq 1 120); do
            status="$(
              aws ssm get-command-invocation \
                --command-id "$command_id" \
                --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                --query 'Status' \
                --output text 2>/dev/null || echo Pending
            )"

            case "$status" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            echo "waiting for SSM deploy command ($i/120): $status"
            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json

          if [ "$status" != "Success" ]; then
            exit 1
          fi

      - name: Verify public health endpoints
        shell: bash
        run: |
          set -euo pipefail

          public_ip="${{ steps.ec2.outputs.public_ip }}"
          curl --retry 18 --retry-all-errors --retry-delay 10 -fsS "http://${public_ip}:8080/api/v1/health"
          curl --retry 18 --retry-all-errors --retry-delay 10 -fsS "http://${public_ip}:8081/admin/health"

          # 앱이 실제로 쓰는 경로는 CloudFront(HTTPS)이므로 origin 도달 여부까지 검증한다.
          # comment 는 terraform(cloudfront.tf)의 "${local.name} user-api HTTPS entrypoint" 와 일치해야 한다.
          # 조회 자체가 실패하면(AccessDenied·throttling 등) 배포를 실패시킨다 — 조회 오류를
          # "배포 없음"으로 오인해 HTTPS 검증을 건너뛴 채 :dev 승격까지 가는 것을 막기 위함이다.
          # 따라서 deploy role 의 cloudfront:ListDistributions 권한(terraform)이 먼저 적용돼 있어야
          # 한다(README 의 CloudFront 롤아웃 순서 참고). 조회가 성공했지만 배포가 없을 때만
          # (최초 terraform apply 전) 경고 후 건너뛴다.
          cf_domain="$(
            aws cloudfront list-distributions \
              --query "DistributionList.Items[?Comment=='rougether-dev user-api HTTPS entrypoint'].DomainName | [0]" \
              --output text
          )"
          if [ -z "$cf_domain" ] || [ "$cf_domain" = "None" ]; then
            echo "::warning::CloudFront distribution not found; skipping HTTPS health check (apply deploy/terraform/ec2 first)"
          else
            # 최초 apply·-replace 직후에는 엣지 전파에 5~10분이 걸려 도메인은 조회되지만 아직
            # 응답이 안 될 수 있다. direct 체크(위)가 이미 통과한 상태이므로, 재시도 예산을
            # 전파 시간보다 길게 잡아(10초×36 ≈ 6분) 그 윈도우의 오탐 실패를 막는다.
            curl --retry 36 --retry-all-errors --retry-delay 10 -fsS "https://${cf_domain}/api/v1/health"
          fi

      # 부트스트랩(terraform user-data)이 쓰는 :dev 태그를 승격한다. EC2 실배포 + health 검증까지
      # 끝난 뒤에만 실행 — 배포 실패로 롤백된 이미지가 :dev 로 남는 것을 막는다.
      # 재빌드 없이 manifest 만 복사하므로 수 초 내 끝난다.
      # 승격은 repo 별 순차라 중간 실패 시 세 :dev 가 서로 다른 SHA 를 가리킬 수 있다 —
      # 스크립트가 기존 digest 를 먼저 저장하고, 실패하면 전체 태그 세트를 복원한다.
      - name: Promote deployed images to :dev
        shell: bash
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: bash .github/scripts/promote-ecr-dev-tags.sh user-api admin-api batch
