name: API 변경 머지 알림

# PR 본문에 "🔔 API 변경" 섹션이 있는 PR이 머지되면 Webex 스페이스로 알림을 보낸다.
# 본문 섹션은 정본(멘션 없음), 알림은 머지 시점 이 메시지 한 번만 — 규칙 정본은 CONTRIBUTING.md §4 "API 변경 섹션".
# WEBEX_BOT_TOKEN은 repo secret. 봇(Rougether Git Bot)이 대상 스페이스 멤버여야 전송된다.

on:
  pull_request:
    types: [closed]

jobs:
  notify:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.body, '## 🔔 API 변경')
    runs-on: ubuntu-latest
    steps:
      - name: Webex 알림 전송
        run: |
          payload=$(jq -n --arg roomId "$WEBEX_ROOM_ID" \
            --arg md "📢 **API 변경 PR 머지됨** — [#${PR_NUMBER} ${PR_TITLE}](${PR_URL}) · 본문의 **🔔 API 변경** 섹션을 확인해 주세요." \
            '{roomId: $roomId, markdown: $md}')
          status=$(curl -s -o response.json -w '%{http_code}' \
            -X POST "https://webexapis.com/v1/messages" \
            -H "Authorization: Bearer $WEBEX_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")
          if [ "$status" != "200" ]; then
            echo "Webex 전송 실패 (HTTP $status)"
            cat response.json
            exit 1
          fi
        env:
          WEBEX_BOT_TOKEN: ${{ secrets.WEBEX_BOT_TOKEN }}
          WEBEX_ROOM_ID: Y2lzY29zcGFyazovL3VybjpURUFNOnVzLXdlc3QtMl9yL1JPT00vNzQ0MmE3MjAtM2JlOS0xMWYxLTk1YzEtMjNhNmNjZTI4Yjcx
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
