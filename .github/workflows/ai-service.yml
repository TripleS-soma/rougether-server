name: AI service

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/**'
      - 'ai-user-worker/**'
      - 'qa/ai-user-memory/**'
      - 'deploy/ai-user-worker/**'
      - 'infra/llm/**'
      - 'qa/ai-service-contract/**'
      - 'deploy/ai-service/**'
      - 'deploy/terraform/ai-ec2/**'
      - '.github/workflows/ai-service.yml'
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - 'ai-user-worker/**'
      - 'qa/ai-user-memory/**'
      - 'deploy/ai-user-worker/**'
      - 'infra/llm/**'
      - 'qa/ai-service-contract/**'
      - 'deploy/ai-service/**'
      - 'deploy/terraform/ai-ec2/**'
      - '.github/workflows/ai-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: AI service contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.10.12
          uv sync --directory ai-service --frozen
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Python behavior and failure tests
        run: uv run --directory ai-service --frozen pytest -q
      - name: AI deployment rollback tests
        run: python3 -m unittest discover -s qa/ai-service-contract -p test_deploy.py
      - name: Java adapter tests
        run: ./gradlew :infra:llm:test
      - name: Real JVM to FastAPI HTTP contract
        run: python qa/ai-service-contract/run.py

  docker-build:
    name: AI service Docker build
    needs: [test, memory-contract]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ai-service
          file: ai-service/Dockerfile
          platforms: linux/amd64
          push: false
          tags: rougether-ai:pr-${{ github.sha }}
          build-args: AI_USER_MEMORY=true

  memory-contract:
    name: Graphiti Neo4j and bounded worker contracts
    runs-on: ubuntu-latest
    env:
      AI_USER_EMBEDDING_CACHE: /tmp/rougether-models
      GRAPHITI_TELEMETRY_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked memory dependencies
        run: |
          python -m pip install uv==0.10.12
          uv sync --directory ai-service --frozen --extra memory
      - name: Prepare public local embedding model
        run: ai-service/.venv/bin/python ai-service/download_memory_model.py
      - name: API and worker tests without paid providers
        run: ai-service/.venv/bin/python -m pytest ai-service/tests ai-user-worker -q
      - name: Worker image includes shared action policy
        run: |
          docker build -f ai-user-worker/Dockerfile -t rougether-ai-users:contract .
          docker run --rm --network none --read-only rougether-ai-users:contract python -c 'from worker import Worker, Settings; from rougether_ai.ai_user_policy import code_plan'
      - name: Real Neo4j memory isolation and long recall
        run: ai-service/.venv/bin/python qa/ai-user-memory/run.py

  publish:
    name: Publish AI service
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, docker-build, memory-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    env:
      AWS_REGION: ap-northeast-2
      REPOSITORY: rougether-dev/ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Check immutable release tag
        id: existing
        run: |
          if aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$GITHUB_SHA" > /tmp/ai-image.json 2>/dev/null; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.found != 'true'
        with:
          context: ai-service
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: AI_USER_MEMORY=true
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.REPOSITORY }}:${{ github.sha }}
      - name: Resolve immutable image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          digest="$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          echo "image=$REGISTRY/$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy AI EC2
    if: vars.AI_SERVICE_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-northeast-2
      AI_INSTANCE_ID: ${{ vars.AI_SERVICE_INSTANCE_ID }}
      AI_IMAGE: ${{ needs.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Candidate smoke and switch with rollback
        run: python3 deploy/ai-service/run-deploy.py "$AI_INSTANCE_ID" "$AI_IMAGE"
