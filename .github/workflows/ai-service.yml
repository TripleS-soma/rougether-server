name: AI service

on:
  pull_request:
    branches: [main]
    paths:
      - 'ai-service/**'
      - 'infra/llm/**'
      - 'qa/ai-service-contract/**'
      - 'deploy/ai-service/**'
      - '.github/workflows/ai-service.yml'
  push:
    branches: [main]
    paths:
      - 'ai-service/**'
      - 'infra/llm/**'
      - 'qa/ai-service-contract/**'
      - 'deploy/ai-service/**'
      - '.github/workflows/ai-service.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-service-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: AI service contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked Python dependencies
        run: |
          python -m pip install uv==0.10.12
          uv sync --directory ai-service --frozen
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Python behavior and failure tests
        run: uv run --directory ai-service --frozen pytest -q
      - name: Java adapter tests
        run: ./gradlew :infra:llm:test
      - name: Real JVM to FastAPI HTTP contract
        run: python qa/ai-service-contract/run.py

  docker-build:
    name: AI service Docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ai-service
          file: ai-service/Dockerfile
          platforms: linux/amd64
          push: false
          tags: rougether-ai:pr-${{ github.sha }}
