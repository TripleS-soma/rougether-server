[project]
name = "rougether-ai"
version = "0.1.0"
description = "Rougether 내부 AI 추론 서비스"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
