services:
  ai-service:
    build:
      args:
        AI_USER_MEMORY: "true"
    environment:
      AI_USERS_ENABLED: "true"
      AI_USER_NEO4J_URI: bolt://neo4j:7687
      AI_USER_NEO4J_USER: neo4j
      AI_USER_NEO4J_PASSWORD: ${AI_USER_NEO4J_PASSWORD:?required}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?required}
      AI_USER_MODEL: ${AI_USER_MODEL:-claude-haiku-5-5}
      AI_USER_HUMAN_MODEL: ${AI_USER_HUMAN_MODEL:-claude-sonnet-5-5}
      AI_USER_MEMORY_MODEL: ${AI_USER_MEMORY_MODEL:-claude-haiku-5-5}
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      neo4j:
        condition: service_healthy
    stop_grace_period: 195s
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${AI_USER_NEO4J_PASSWORD:?required}
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 1G
    volumes:
      - ai-user-neo4j:/data
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 1.0
    pids_limit: 256
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
volumes:
  ai-user-neo4j:
