# 준비 중에는 네트워크 설정이 끝난 프로세스만 시작한다.
x-warm: &warm
  restart: "no"
  entrypoint:
    - /bin/sh
    - -ec
    - |
      until test -f /tmp/.release-network-ready; do sleep 1; done
      exec /bin/sh -ec "$$1"
    - warm

services:
  mysql:
    volumes:
      - type: bind
        source: ${DB_ROOT_CNF:?}
        target: /run/release-root.cnf
        read_only: true
        bind: {create_host_path: false}
  user-api: *warm
  admin-api: *warm
