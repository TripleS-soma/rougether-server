services:
  stage-https:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    env_file: ${STAGE_HTTPS_DIR:?}/gateway.env
    volumes:
      - ${STAGE_HTTPS_DIR:?}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${STAGE_HTTPS_DIR:?}/web:/srv/test:ro
      - stage-tls:/data
    ports:
      - "0.0.0.0:80:80/tcp"
      - "0.0.0.0:443:443/tcp"
    networks: [default, stage-ingress]
  stage-google-keys:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    volumes:
      - ${STAGE_HTTPS_DIR:?}/GoogleKeys.Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [default, stage-ingress]
  stage-objects:
    image: chrislusf/seaweedfs@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    command: ["mini", "-dir=/data", "-bucket=rougether-synthetic-only", "-s3.domainName=stage-objects", "-s3.config=/etc/weed/qa-s3.json"]
    restart: unless-stopped
    mem_limit: 384m
    volumes:
      - stage-synthetic-objects:/data
      - ${STAGE_HTTPS_DIR:?}/qa-s3.json:/etc/weed/qa-s3.json:ro
    networks:
      default:
        aliases: [rougether-synthetic-only.stage-objects]
  user-api:
    env_file: ${STAGE_HTTPS_DIR:?}/qa-object.env
    environment:
      ASSET_S3_ENDPOINT: ""
      AWS_ENDPOINT_URL_S3: http://stage-objects:8333
      ASSET_S3_BUCKET: rougether-synthetic-only
      CORS_ALLOWED_ORIGINS: https://${STAGE_IP:?},https://app.rougether.com
      GOOGLE_CERTS_URL: http://stage-google-keys:8089/keys
networks:
  stage-ingress: {}
volumes:
  stage-tls: {}
  stage-synthetic-objects: {}
