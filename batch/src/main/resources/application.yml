spring:
  application:
    name: rougether-batch
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/rougether?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
  task:
    scheduling:
      pool:
        size: 10 # 기존 9개 트리거 + 고양이 복귀 알림. 긴 작업이 reminder 발화를 막지 않게 확보함.

server:
  port: 8082

# 명시적 foreground 활동을 기록한 사용자만 대상임. false로 복귀 알림 적재·발송을 함께 중지함.
app-icon:
  reminder:
    enabled: ${APP_ICON_REMINDER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

# 주간 회고 LLM(OpenAI 호환 chat/completions, 기본 OpenAI). api-key 가 비면 StubLlmClient 로 대체되고 회고 배치는 보류된다.
llm:
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-5.6-luna}
  api-key: ${LLM_API_KEY:}
  timeout: ${LLM_TIMEOUT:30s}
  reasoning-effort: ${LLM_REASONING_EFFORT:low}
  json-mode: ${LLM_JSON_MODE:true}

# AI 추천 홀드아웃 실험 kill switch. false 면 배정·적격 기록과 CONTROL 게이트를 모두 건너뛰고
# 전원에게 추천을 준다(기존 배정 행은 보존). 실험 종료 시 배포 없이 CONTROL 추천을 재개하는 경로.
recommendation:
  experiment:
    holdout-enabled: ${RECOMMENDATION_HOLDOUT_ENABLED:true}

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
