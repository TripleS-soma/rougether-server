services:
  worker:
    build:
      context: ..
      dockerfile: ai-user-worker/Dockerfile
    restart: "no"
    init: true
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 32
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      AI_USER_CONTROL_URL: ${AI_USER_CONTROL_URL:?private HTTPS origin required}
      AI_USER_CONTROL_TOKEN: ${AI_USER_CONTROL_TOKEN:?required}
      AI_USER_SERVICE_URL: ${AI_USER_SERVICE_URL:?private AI service origin required}
      AI_USER_SERVICE_TOKEN: ${AI_USER_SERVICE_TOKEN:?required}
      AI_USER_MAX_JOBS: ${AI_USER_MAX_JOBS:-10}
      AI_USER_MAX_SECONDS: ${AI_USER_MAX_SECONDS:-600}
      AI_USER_MEMORY_BATCH_LIMIT: ${AI_USER_MEMORY_BATCH_LIMIT:-10}
      AI_USER_ALLOW_PRIVATE_HTTP: ${AI_USER_ALLOW_PRIVATE_HTTP:-false}
    logging:
      options:
        max-size: 5m
        max-file: "3"
