<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Rougether Admin · 에셋 조회</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="app-body">
    <header class="app-header">
        <div class="brand brand-sm">
            <span class="brand-mark">R</span>
            <h1>Rougether <span class="badge">ADMIN</span></h1>
        </div>
        <nav class="app-nav">
            <a th:href="@{/}">에셋 업로드</a>
            <a th:href="@{/assets}" class="active">에셋 조회</a>
            <a th:href="@{/asset-foundry}">Asset Foundry</a>
            <a th:href="@{/catalog}">카탈로그</a>
            <a th:href="@{/item-slots}">가구 관리</a>
            <a th:href="@{/accessory-render-profiles}">악세사리 관리</a>
            <a th:href="@{/users}">유저 관리</a>
            <a th:href="@{/weekly-reports}">AI 회고</a>
            <a th:href="@{/banned-words}">금칙어</a>
            <a th:href="@{/bug-reports}">버그 제보</a>
        </nav>
        <div class="header-right">
            <span class="user-chip"><span th:text="${username}">admin</span> 님</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-ghost">로그아웃</button>
            </form>
        </div>
    </header>

    <main class="app-main app-main--wide">
        <div class="upload-card">
            <div class="upload-head">
                <h2>에셋 조회</h2>
                <p>S3에 올라간 에셋을 종류별로 둘러보고 asset key를 복사합니다. 프론트는 key를 CDN base URL과 조합해 사용합니다.</p>
            </div>

            <div class="asset-tabs" id="tabs">
                <button class="asset-tab active" data-kind="items">items</button>
                <button class="asset-tab" data-kind="characters">characters</button>
                <button class="asset-tab" data-kind="categories">categories</button>
                <button class="asset-tab" data-kind="themes">themes</button>
                <button class="asset-tab" data-kind="house">house</button>
            </div>

            <div class="slot-toolbar">
                <input type="search" id="filter" class="slot-search" placeholder="key 검색 (예: bakery, chair)">
                <label class="filter-toggle" for="animated-only">
                    <input type="checkbox" id="animated-only">
                    <span>움짤만 보기</span>
                </label>
                <span class="slot-count" id="count"></span>
            </div>

            <section class="pose-admin-panel" id="pose-panel" hidden>
                <div class="pose-admin-heading">
                    <div>
                        <h3>캐릭터 포즈 DB 등록</h3>
                        <p>카드의 ‘포즈 등록’으로 key를 채운 뒤 캐릭터와 포즈 코드를 저장하세요.</p>
                    </div>
                </div>
                <form class="pose-admin-form" id="pose-form">
                    <label>캐릭터
                        <select class="slot-select" id="pose-character" required></select>
                    </label>
                    <label>포즈 코드
                        <input class="slot-search" id="pose-code" maxlength="40"
                               pattern="[a-z0-9][a-z0-9_-]{0,39}" placeholder="temp1" required>
                    </label>
                    <label>정렬
                        <input class="slot-search" id="pose-sort" type="number" min="0" value="10" required>
                    </label>
                    <label class="filter-toggle pose-active">
                        <input type="checkbox" id="pose-active" checked>
                        <span>활성</span>
                    </label>
                    <label class="pose-key-field">asset key
                        <input class="slot-search" id="pose-key" maxlength="255"
                               placeholder="characters/....webp" required>
                    </label>
                    <button class="copy-btn pose-save" type="submit">DB 등록</button>
                </form>
                <div class="pose-admin-list" id="pose-list"></div>
            </section>

            <div class="alert alert-error" id="error" hidden></div>
            <div class="asset-grid" id="grid"></div>
        </div>
    </main>

    <script th:src="@{/js/copy.js}"></script>
    <script th:inline="javascript">
        const s3BaseUrl = /*[[${s3BaseUrl}]]*/ '';
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        const grid = document.getElementById('grid');
        const filterInput = document.getElementById('filter');
        const animatedOnlyInput = document.getElementById('animated-only');
        const countEl = document.getElementById('count');
        const errorBox = document.getElementById('error');
        const tabs = document.getElementById('tabs');
        const posePanel = document.getElementById('pose-panel');
        const poseForm = document.getElementById('pose-form');
        const poseCharacter = document.getElementById('pose-character');
        const poseCode = document.getElementById('pose-code');
        const poseKey = document.getElementById('pose-key');
        const poseSort = document.getElementById('pose-sort');
        const poseActive = document.getElementById('pose-active');
        const poseList = document.getElementById('pose-list');
        // kind 별 목록 캐시 — 탭을 오갈 때 재요청하지 않는다.
        const cache = {};
        let currentKind = 'items';
        let assets = [];
        let posesLoaded = false;
        let poses = [];

        loadKind(currentKind);

        tabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.asset-tab');
            if (!tab || tab.dataset.kind === currentKind) return;
            tabs.querySelectorAll('.asset-tab').forEach((t) => t.classList.remove('active'));
            tab.classList.add('active');
            currentKind = tab.dataset.kind;
            posePanel.hidden = currentKind !== 'characters';
            if (currentKind === 'characters') loadPoseAdminData();
            loadKind(currentKind);
        });

        async function loadKind(kind) {
            if (cache[kind]) {
                assets = cache[kind];
                render();
                return;
            }
            grid.replaceChildren();
            countEl.textContent = '불러오는 중…';
            try {
                const res = await fetch('/admin/assets?kind=' + encodeURIComponent(kind));
                if (!res.ok) {
                    showError('목록 조회 실패 (HTTP ' + res.status + ')');
                    return;
                }
                cache[kind] = (await res.json()).items;
                assets = cache[kind];
                render();
            } catch (err) {
                showError('목록 조회 중 오류: ' + err.message);
            }
        }

        function render() {
            const keyword = filterInput.value.trim().toLowerCase();
            const animatedOnly = animatedOnlyInput.checked;
            const visible = assets.filter((asset) =>
                (!keyword || asset.key.toLowerCase().includes(keyword)) &&
                (!animatedOnly || asset.animated));

            grid.replaceChildren(...visible.map(buildCard));
            countEl.textContent = visible.length + ' / ' + assets.length + '개';
        }

        function buildCard(asset) {
            const card = document.createElement('div');
            card.className = 'asset-card';

            const thumbWrap = document.createElement('div');
            thumbWrap.className = 'asset-thumb-wrap';
            const img = document.createElement('img');
            img.className = 'asset-thumb';
            img.loading = 'lazy';
            img.alt = asset.key;
            // 동일한 S3 key를 덮어쓴 경우에도 브라우저가 이전 이미지를 재사용하지 않도록
            // 목록 응답의 최종 수정 시각을 썸네일 URL 버전으로 사용한다.
            const assetVersion = encodeURIComponent(asset.lastModified);
            img.src = s3BaseUrl + '/' + asset.key + '?v=' + assetVersion;
            thumbWrap.appendChild(img);
            if (asset.animated) {
                const badge = document.createElement('span');
                badge.className = 'asset-animated-badge';
                badge.textContent = '움짤';
                thumbWrap.appendChild(badge);
            }

            const keyEl = document.createElement('div');
            keyEl.className = 'asset-key';
            keyEl.textContent = fileName(asset.key);
            keyEl.title = asset.key;

            const meta = document.createElement('div');
            meta.className = 'asset-meta';
            meta.textContent = formatSize(asset.size);

            const copyBtn = document.createElement('button');
            copyBtn.type = 'button';
            copyBtn.className = 'copy-btn asset-copy';
            copyBtn.textContent = 'key 복사';
            copyBtn.addEventListener('click', async () => {
                const ok = await copyText(asset.key);
                copyBtn.textContent = ok ? '복사됨' : '복사 실패';
                setTimeout(() => { copyBtn.textContent = 'key 복사'; }, 1200);
            });

            const actions = document.createElement('div');
            actions.className = 'asset-card-actions';
            actions.append(copyBtn);

            if (currentKind === 'characters') {
                const registerBtn = document.createElement('button');
                registerBtn.type = 'button';
                registerBtn.className = 'btn-ghost asset-action-btn';
                registerBtn.textContent = '포즈 등록';
                registerBtn.addEventListener('click', () => {
                    poseKey.value = asset.key;
                    poseCode.focus();
                    posePanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.type = 'button';
                deleteBtn.className = 'btn-ghost asset-action-btn asset-delete-btn';
                deleteBtn.textContent = 'S3 삭제';
                deleteBtn.addEventListener('click', () => deleteAsset(asset, deleteBtn));
                actions.append(registerBtn, deleteBtn);
            }

            card.append(thumbWrap, keyEl, meta, actions);
            return card;
        }

        async function loadPoseAdminData(force = false) {
            if (posesLoaded && !force) return;
            try {
                const [charactersRes, posesRes] = await Promise.all([
                    fetch('/admin/characters'),
                    fetch('/admin/character-poses')
                ]);
                if (!charactersRes.ok || !posesRes.ok) {
                    throw new Error('캐릭터 또는 포즈 목록을 불러오지 못했습니다.');
                }
                const characters = await charactersRes.json();
                poseCharacter.replaceChildren(...characters.map((character) =>
                    new Option(character.name + ' (' + character.code + ')', character.code)));
                poses = await posesRes.json();
                posesLoaded = true;
                renderPoseList();
            } catch (err) {
                showError(err.message);
            }
        }

        function renderPoseList() {
            if (poses.length === 0) {
                poseList.textContent = '등록된 포즈가 없습니다.';
                return;
            }
            poseList.replaceChildren(...poses.map((pose) => {
                const row = document.createElement('div');
                row.className = 'pose-admin-row';
                const text = document.createElement('span');
                text.textContent = pose.characterCode + ' · ' + pose.code + ' · ' + pose.assetKey
                    + (pose.active ? '' : ' · 비활성');
                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'btn-ghost asset-action-btn asset-delete-btn';
                removeBtn.textContent = 'DB 연결 해제';
                removeBtn.addEventListener('click', () => deletePose(pose, removeBtn));
                row.append(text, removeBtn);
                return row;
            }));
        }

        poseForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const saveBtn = poseForm.querySelector('button[type="submit"]');
            saveBtn.disabled = true;
            try {
                const res = await fetch('/admin/character-poses', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                    body: JSON.stringify({
                        characterCode: poseCharacter.value,
                        code: poseCode.value.trim(),
                        assetKey: poseKey.value.trim(),
                        sortOrder: Number(poseSort.value),
                        active: poseActive.checked
                    })
                });
                const result = await readJson(res);
                if (!res.ok) throw new Error(result.message || ('HTTP ' + res.status));
                posesLoaded = false;
                await loadPoseAdminData(true);
                saveBtn.textContent = '등록 완료';
                setTimeout(() => { saveBtn.textContent = 'DB 등록'; }, 1200);
            } catch (err) {
                showError('포즈 등록 실패: ' + err.message);
            } finally {
                saveBtn.disabled = false;
            }
        });

        async function deletePose(pose, button) {
            if (!confirm(pose.characterCode + '/' + pose.code + ' DB 연결을 해제할까요?')) return;
            button.disabled = true;
            try {
                const res = await fetch('/admin/character-poses/' + pose.id, {
                    method: 'DELETE',
                    headers: { [csrfHeader]: csrfToken }
                });
                if (!res.ok) {
                    const result = await readJson(res);
                    throw new Error(result.message || ('HTTP ' + res.status));
                }
                poses = poses.filter((item) => item.id !== pose.id);
                renderPoseList();
            } catch (err) {
                showError('DB 연결 해제 실패: ' + err.message);
                button.disabled = false;
            }
        }

        async function deleteAsset(asset, button) {
            if (!confirm(asset.key + '\n\nS3에서 제거할까요? 복구용 archive 사본은 남습니다.')) return;
            button.disabled = true;
            try {
                const res = await fetch('/admin/assets?key=' + encodeURIComponent(asset.key), {
                    method: 'DELETE',
                    headers: { [csrfHeader]: csrfToken }
                });
                const result = await readJson(res);
                if (!res.ok) throw new Error(result.message || ('HTTP ' + res.status));
                cache.characters = (cache.characters || []).filter((item) => item.key !== asset.key);
                assets = cache.characters;
                render();
            } catch (err) {
                showError('S3 삭제 실패: ' + err.message);
                button.disabled = false;
            }
        }

        async function readJson(response) {
            const text = await response.text();
            if (!text) return {};
            try { return JSON.parse(text); } catch (err) { return {}; }
        }

        function fileName(key) {
            return key.substring(key.lastIndexOf('/') + 1);
        }

        function formatSize(bytes) {
            if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
            if (bytes >= 1024) return Math.round(bytes / 1024) + ' KB';
            return bytes + ' B';
        }

        function showError(msg) {
            errorBox.textContent = msg;
            errorBox.hidden = false;
            setTimeout(() => { errorBox.hidden = true; }, 4000);
        }

        filterInput.addEventListener('input', render);
        animatedOnlyInput.addEventListener('change', render);
    </script>
</body>
</html>
