<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rougether Admin · 버그 제보</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="app-body">
    <header class="app-header">
        <div class="brand brand-sm">
            <span class="brand-mark">R</span>
            <h1>Rougether <span class="badge">ADMIN</span></h1>
        </div>
        <nav class="app-nav">
            <a th:href="@{/}">에셋 업로드</a>
            <a th:href="@{/assets}">에셋 조회</a>
            <a th:href="@{/asset-foundry}">Asset Foundry</a>
            <a th:href="@{/catalog}">카탈로그</a>
            <a th:href="@{/item-slots}">가구 관리</a>
            <a th:href="@{/accessory-render-profiles}">악세사리 관리</a>
            <a th:href="@{/users}">유저 관리</a>
            <a th:href="@{/weekly-reports}">AI 회고</a>
            <a th:href="@{/recommendations}">AI 추천</a>
            <a th:href="@{/banned-words}">금칙어</a>
            <a th:href="@{/bug-reports}" class="active">버그 제보</a>
        </nav>
        <div class="header-right">
            <span class="user-chip"><span th:text="${username}">admin</span> 님</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-ghost">로그아웃</button>
            </form>
        </div>
    </header>

    <main class="app-main app-main--wide">
        <div class="upload-card">
            <div class="upload-head">
                <h2>버그 제보</h2>
                <p>유저가 앱에서 제출한 버그 제보입니다. 상태 변경과 답장은 유저의 내 제보 목록에 반영되고,
                    답장은 FCM 푸시로도 알립니다.</p>
            </div>

            <div class="slot-toolbar">
                <select id="statusFilter" class="slot-select">
                    <option value="">전체 상태</option>
                    <option value="RECEIVED">접수</option>
                    <option value="IN_PROGRESS">확인 중</option>
                    <option value="RESOLVED">완료</option>
                </select>
                <span class="slot-count" id="count"></span>
            </div>

            <div class="alert alert-error" id="error" hidden></div>

            <table class="slot-table">
                <thead>
                <tr>
                    <th>제보자</th>
                    <th>제목 / 내용</th>
                    <th>환경</th>
                    <th>스크린샷</th>
                    <th>상태</th>
                    <th>답장</th>
                    <th>제출일</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <script th:inline="javascript">
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        const STATUSES = [ ['RECEIVED', '접수'], ['IN_PROGRESS', '확인 중'], ['RESOLVED', '완료'] ];
        const tbody = document.getElementById('rows');
        const countEl = document.getElementById('count');
        const errorBox = document.getElementById('error');
        const statusFilter = document.getElementById('statusFilter');
        statusFilter.addEventListener('change', load);

        load();

        async function load() {
            hideError();
            const query = statusFilter.value ? ('?status=' + statusFilter.value) : '';
            try {
                const res = await fetch('/admin/bug-reports' + query);
                if (!res.ok) {
                    showError('목록 조회 실패 (HTTP ' + res.status + ')');
                    return;
                }
                render((await res.json()).items);
            } catch (err) {
                showError('목록 조회 중 오류: ' + err.message);
            }
        }

        function render(items) {
            tbody.replaceChildren(...items.flatMap(buildRows));
            countEl.textContent = items.length + '건';
        }

        // 제보 1건 = 본문 행 + (접힌) 답장 패널 행. 패널은 답장 버튼으로 토글한다.
        function buildRows(item) {
            const detailTr = buildReplyPanelRow(item);
            detailTr.hidden = true;
            return [buildRow(item, detailTr), detailTr];
        }

        function buildRow(item, detailTr) {
            const tr = document.createElement('tr');

            const userCell = document.createElement('td');
            userCell.textContent = (item.nickname ?? '(닉네임 없음)') + ' #' + item.userId;

            const bodyCell = document.createElement('td');
            const titleEl = document.createElement('div');
            titleEl.className = 'slot-name';
            titleEl.textContent = item.title;
            const contentEl = document.createElement('div');
            contentEl.className = 'slot-key';
            contentEl.textContent = item.content;
            bodyCell.append(titleEl, contentEl);

            const envCell = document.createElement('td');
            envCell.textContent = [item.appVersion, item.deviceInfo].filter(Boolean).join(' / ') || '-';

            const shotCell = document.createElement('td');
            (item.screenshotKeys ?? []).forEach((key) => {
                const screenshotUrl = '/admin/bug-reports/screenshots?key=' + encodeURIComponent(key);
                const link = document.createElement('a');
                link.href = screenshotUrl;
                link.target = '_blank';
                link.rel = 'noopener';
                const img = document.createElement('img');
                img.className = 'slot-thumb';
                img.loading = 'lazy';
                img.alt = '스크린샷';
                img.src = screenshotUrl;
                link.appendChild(img);
                shotCell.appendChild(link);
            });
            if (!(item.screenshotKeys ?? []).length) shotCell.textContent = '-';

            const statusCell = document.createElement('td');
            const statusSelect = document.createElement('select');
            statusSelect.className = 'slot-select';
            STATUSES.forEach(([code, label]) => statusSelect.add(new Option(label, code)));
            statusSelect.value = item.status;
            statusSelect.addEventListener('change', () => changeStatus(item, statusSelect));
            statusCell.appendChild(statusSelect);

            const replyCell = document.createElement('td');
            const replyToggle = document.createElement('button');
            replyToggle.type = 'button';
            replyToggle.className = 'btn-ghost';
            replyToggle.textContent = '답장 ' + (item.replies ?? []).length + '건';
            replyToggle.addEventListener('click', () => { detailTr.hidden = !detailTr.hidden; });
            replyCell.appendChild(replyToggle);

            const dateCell = document.createElement('td');
            dateCell.textContent = item.createdAt
                ? new Date(item.createdAt).toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul' })
                : '-';

            tr.append(userCell, bodyCell, envCell, shotCell, statusCell, replyCell, dateCell);
            return tr;
        }

        // 답장 이력 + 작성 폼. 전송 성공 시 목록을 다시 불러 상태·답장 수를 함께 갱신한다.
        function buildReplyPanelRow(item) {
            const tr = document.createElement('tr');
            const cell = document.createElement('td');
            cell.colSpan = 7;

            const history = document.createElement('div');
            (item.replies ?? []).forEach((reply) => {
                const line = document.createElement('div');
                const meta = document.createElement('div');
                meta.className = 'slot-key';
                meta.textContent = reply.adminUsername + ' · '
                    + new Date(reply.createdAt).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' });
                const contentEl = document.createElement('div');
                contentEl.className = 'slot-name';
                contentEl.textContent = reply.content;
                line.style.marginBottom = '8px';
                line.append(meta, contentEl);
                history.appendChild(line);
            });
            if (!(item.replies ?? []).length) {
                const empty = document.createElement('div');
                empty.className = 'slot-key';
                empty.textContent = '아직 답장이 없습니다.';
                history.appendChild(empty);
            }

            const textarea = document.createElement('textarea');
            textarea.className = 'slot-search';
            textarea.rows = 3;
            textarea.maxLength = 2000;
            textarea.placeholder = '답장 내용 (전송 시 유저에게 푸시 알림이 갑니다)';
            textarea.style.width = '100%';
            textarea.style.resize = 'vertical';
            textarea.style.margin = '8px 0';

            const statusSelect = document.createElement('select');
            statusSelect.className = 'slot-select';
            statusSelect.add(new Option('상태 유지', ''));
            STATUSES.forEach(([code, label]) => statusSelect.add(new Option('→ ' + label, code)));

            const sendBtn = document.createElement('button');
            sendBtn.type = 'button';
            sendBtn.className = 'btn-primary';
            sendBtn.textContent = '답장 보내기';
            sendBtn.addEventListener('click', () => sendReply(item, textarea, statusSelect, sendBtn));

            const formRow = document.createElement('div');
            formRow.style.display = 'flex';
            formRow.style.gap = '8px';
            formRow.append(statusSelect, sendBtn);

            cell.append(history, textarea, formRow);
            tr.appendChild(cell);
            return tr;
        }

        async function sendReply(item, textarea, statusSelect, sendBtn) {
            const content = textarea.value.trim();
            if (!content) {
                showError('답장 내용을 입력해 주세요.');
                return;
            }
            sendBtn.disabled = true;
            hideError();
            try {
                const body = { content };
                if (statusSelect.value) body.status = statusSelect.value;
                const res = await fetch('/admin/bug-reports/' + item.bugReportId + '/replies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                    body: JSON.stringify(body)
                });
                if (!res.ok) {
                    throw new Error(await errorMessage(res));
                }
                await load();
            } catch (err) {
                showError('답장 전송 실패: ' + err.message);
            } finally {
                sendBtn.disabled = false;
            }
        }

        async function changeStatus(item, statusSelect) {
            const previous = item.status;
            statusSelect.disabled = true;
            hideError();
            try {
                const res = await fetch('/admin/bug-reports/' + item.bugReportId + '/status', {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                    body: JSON.stringify({ status: statusSelect.value })
                });
                if (!res.ok) {
                    throw new Error(await errorMessage(res));
                }
                item.status = (await res.json()).status;
            } catch (err) {
                statusSelect.value = previous;
                showError('상태 변경 실패: ' + err.message);
            } finally {
                statusSelect.disabled = false;
            }
        }

        async function errorMessage(response) {
            try {
                const body = await response.json();
                return body.message || ('HTTP ' + response.status);
            } catch {
                return 'HTTP ' + response.status;
            }
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        function hideError() {
            errorBox.hidden = true;
        }
    </script>
</body>
</html>
