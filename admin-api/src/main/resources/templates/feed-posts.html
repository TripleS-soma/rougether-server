<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rougether Admin · 피드</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="app-body">
    <header class="app-header">
        <div class="brand brand-sm">
            <span class="brand-mark">R</span>
            <h1>Rougether <span class="badge">ADMIN</span></h1>
        </div>
        <nav class="app-nav">
            <a th:href="@{/}">에셋 업로드</a>
            <a th:href="@{/assets}">에셋 조회</a>
            <a th:href="@{/asset-foundry}">Asset Foundry</a>
            <a th:href="@{/catalog}">카탈로그</a>
            <a th:href="@{/item-slots}">가구 관리</a>
            <a th:href="@{/user-activities}">사용자 활동</a>
            <a th:href="@{/users}">유저 관리</a>
            <a th:href="@{/weekly-reports}">AI 회고</a>
            <a th:href="@{/recommendations}">AI 추천</a>
            <a th:href="@{/banned-words}">금칙어</a>
            <a th:href="@{/bug-reports}">버그 제보</a>
            <a th:href="@{/notification-campaigns}">알림 발송</a>
            <a th:href="@{/content-reports}">신고</a>
            <a th:href="@{/feed-posts}" class="active">피드</a>
        </nav>
        <div class="header-right">
            <span class="user-chip"><span th:text="${username}">admin</span> 님</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-ghost">로그아웃</button>
            </form>
        </div>
    </header>

    <main class="app-main app-main--wide">
        <div class="upload-card">
            <div class="upload-head">
                <h2>피드 관리</h2>
                <p>피드에 올라온 글을 최신순으로 봅니다. 삭제하면 본문이 지워지고 댓글·좋아요가 함께 사라지며,
                    그 글에 걸린 대기 신고도 닫힙니다. 되돌릴 수 없고 작성자에게 알림은 보내지 않습니다.</p>
            </div>

            <div class="slot-toolbar">
                <label><input type="checkbox" id="includeDeleted"> 삭제된 글 포함</label>
                <button type="button" class="btn-ghost" id="prev">이전</button>
                <button type="button" class="btn-ghost" id="next">다음</button>
                <span class="slot-count" id="count"></span>
            </div>

            <div class="alert alert-error" id="error" hidden></div>

            <table class="slot-table">
                <thead>
                <tr>
                    <th>글</th>
                    <th>내용</th>
                    <th>작성자</th>
                    <th>작성일</th>
                    <th>처리</th>
                </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <script th:inline="javascript">
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        const BOARDS = { VERIFICATION: '인증', FREE: '자유' };
        const SIZE = 20;
        const tbody = document.getElementById('rows');
        const countEl = document.getElementById('count');
        const errorBox = document.getElementById('error');
        const includeDeleted = document.getElementById('includeDeleted');
        let page = 0;
        let total = 0;
        includeDeleted.addEventListener('change', () => { page = 0; load(); });
        document.getElementById('prev').addEventListener('click', () => { if (page > 0) { page--; load(); } });
        document.getElementById('next').addEventListener('click', () => {
            if ((page + 1) * SIZE < total) { page++; load(); }
        });

        load();

        function when(value) {
            return value ? new Date(value).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul' }) : '-';
        }

        async function load() {
            hideError();
            const params = new URLSearchParams({ page, size: SIZE, includeDeleted: includeDeleted.checked });
            try {
                const res = await fetch('/admin/feed-posts?' + params);
                if (!res.ok) {
                    throw new Error(await errorMessage(res));
                }
                const body = await res.json();
                total = body.totalElements;
                tbody.replaceChildren(...body.items.map(buildRow));
                countEl.textContent = '총 ' + total + '건 · ' + (page + 1) + '페이지';
            } catch (err) {
                showError('목록 조회 실패: ' + err.message);
            }
        }

        function cell(text) {
            const td = document.createElement('td');
            td.textContent = text ?? '-';
            return td;
        }

        function buildRow(item) {
            const tr = document.createElement('tr');
            const contentCell = document.createElement('td');
            const text = document.createElement('div');
            text.className = 'slot-name';
            text.textContent = item.deletedAt ? '(삭제됨)' : (item.text || '(본문 없음)');
            contentCell.appendChild(text);
            (item.imageIds || []).forEach((imageId) => {
                const url = '/admin/feed-posts/images/' + imageId;
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener';
                const img = document.createElement('img');
                img.className = 'slot-thumb';
                img.loading = 'lazy';
                img.alt = '게시물 사진';
                img.src = url;
                link.appendChild(img);
                contentCell.appendChild(link);
            });

            const author = (item.authorNickname ?? '(닉네임 없음)') + ' #' + item.authorUserId
                + (item.authorWithdrawn ? ' (탈퇴)' : '');

            const actionCell = document.createElement('td');
            if (item.deletedAt) {
                actionCell.textContent = '삭제 ' + when(item.deletedAt);
            } else {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'btn-ghost';
                button.textContent = '삭제';
                button.addEventListener('click', () => remove(item, button));
                actionCell.appendChild(button);
            }

            tr.append(cell('#' + item.postId + ' · ' + (BOARDS[item.boardType] || item.boardType)), contentCell,
                cell(author), cell(when(item.createdAt)), actionCell);
            return tr;
        }

        async function remove(item, button) {
            if (!confirm('글 #' + item.postId + '을(를) 삭제할까요? 댓글·좋아요도 함께 사라지고 되돌릴 수 없습니다.')) return;
            button.disabled = true;
            hideError();
            try {
                const res = await fetch('/admin/feed-posts/' + item.postId, {
                    method: 'DELETE',
                    headers: { [csrfHeader]: csrfToken }
                });
                if (!res.ok) {
                    throw new Error(await errorMessage(res));
                }
                await load();
            } catch (err) {
                showError('삭제 실패: ' + err.message);
                button.disabled = false;
            }
        }

        async function errorMessage(response) {
            try {
                const body = await response.json();
                return body.message || ('HTTP ' + response.status);
            } catch {
                return 'HTTP ' + response.status;
            }
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        function hideError() {
            errorBox.hidden = true;
        }
    </script>
</body>
</html>
