<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rougether Admin · 카탈로그 관리</title>
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="app-body">
    <header class="app-header">
        <div class="brand brand-sm">
            <span class="brand-mark">R</span>
            <h1>Rougether <span class="badge">ADMIN</span></h1>
        </div>
        <nav class="app-nav">
            <a th:href="@{/}">에셋 업로드</a>
            <a th:href="@{/assets}">에셋 조회</a>
            <a th:href="@{/catalog}" class="active">카탈로그</a>
            <a th:href="@{/item-slots}">가구 관리</a>
            <a th:href="@{/accessory-render-profiles}">악세사리 관리</a>
            <a th:href="@{/users}">유저 관리</a>
            <a th:href="@{/banned-words}">금칙어</a>
            <a th:href="@{/bug-reports}">버그 제보</a>
        </nav>
        <div class="header-right">
            <span class="user-chip"><span th:text="${username}">admin</span> 님</span>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn-ghost">로그아웃</button>
            </form>
        </div>
    </header>

    <main class="app-main">
        <div class="upload-card">
            <div class="upload-head">
                <h2>카탈로그 관리</h2>
                <p>아이템·캐릭터의 사용/미사용을 전환합니다. <strong>사용</strong>으로 바꾸면 상점·캐릭터 목록·뽑기에
                    다음 요청부터 바로 노출됩니다. 활성화 시 S3에 실제 에셋이 있는지 검증합니다
                    (캐릭터는 애니메이션 3종 포함).</p>
            </div>

            <div class="alert alert-error" id="error" hidden></div>

            <div class="asset-tabs">
                <button type="button" class="asset-tab catalog-tab active" data-tab="items">아이템</button>
                <button type="button" class="asset-tab catalog-tab" data-tab="characters">캐릭터</button>
            </div>

            <div class="slot-toolbar">
                <input type="text" id="search" class="slot-search" placeholder="이름·코드·테마로 검색">
                <label class="slot-count"><input type="checkbox" id="inactiveOnly"> 미사용만 보기</label>
                <span class="slot-count" id="count"></span>
            </div>

            <section id="itemsSection">
                <div class="slot-table-wrap">
                    <table class="slot-table">
                        <thead>
                        <tr>
                            <th>이미지</th>
                            <th>이름</th>
                            <th>테마</th>
                            <th>카테고리</th>
                            <th>배치</th>
                            <th>가격</th>
                            <th>상태</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="itemRows"></tbody>
                    </table>
                </div>
            </section>

            <section id="charactersSection" hidden>
                <div class="slot-table-wrap">
                    <table class="slot-table">
                        <thead>
                        <tr>
                            <th>이미지</th>
                            <th>코드</th>
                            <th>이름</th>
                            <th>정렬</th>
                            <th>상태</th>
                            <th></th>
                        </tr>
                        </thead>
                        <tbody id="characterRows"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script th:inline="javascript">
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
        const s3BaseUrl = /*[[${s3BaseUrl}]]*/ '';
        const errorBox = document.getElementById('error');
        const searchInput = document.getElementById('search');
        const inactiveOnly = document.getElementById('inactiveOnly');
        const countEl = document.getElementById('count');

        let currentTab = 'items';
        let items = [];
        let characters = [];

        document.querySelectorAll('.catalog-tab').forEach(tab => {
            tab.addEventListener('click', () => switchTab(tab.dataset.tab));
        });
        searchInput.addEventListener('input', render);
        inactiveOnly.addEventListener('change', render);

        loadAll();

        async function loadAll() {
            hideError();
            try {
                const [itemsRes, charactersRes] = await Promise.all([
                    fetch('/admin/catalog/items'),
                    fetch('/admin/catalog/characters')
                ]);
                if (!itemsRes.ok || !charactersRes.ok) {
                    showError('목록 조회 실패 (HTTP ' + (itemsRes.ok ? charactersRes.status : itemsRes.status) + ')');
                    return;
                }
                items = (await itemsRes.json()).items;
                characters = (await charactersRes.json()).characters;
                render();
            } catch (err) {
                showError('목록 조회 중 오류: ' + err.message);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.catalog-tab').forEach(button => {
                button.classList.toggle('active', button.dataset.tab === tab);
            });
            document.getElementById('itemsSection').hidden = tab !== 'items';
            document.getElementById('charactersSection').hidden = tab !== 'characters';
            render();
        }

        function render() {
            const query = searchInput.value.trim().toLowerCase();
            if (currentTab === 'items') {
                const visible = items.filter(item =>
                    matches(query, [item.name, item.themeCode, item.themeName, item.categoryCode])
                        && (!inactiveOnly.checked || !item.active));
                document.getElementById('itemRows').replaceChildren(...visible.map(buildItemRow));
                countEl.textContent = visible.length + ' / ' + items.length + '개';
            } else {
                const visible = characters.filter(character =>
                    matches(query, [character.code, character.name])
                        && (!inactiveOnly.checked || !character.active));
                document.getElementById('characterRows').replaceChildren(...visible.map(buildCharacterRow));
                countEl.textContent = visible.length + ' / ' + characters.length + '개';
            }
        }

        function matches(query, fields) {
            if (!query) return true;
            return fields.some(field => (field || '').toLowerCase().includes(query));
        }

        function buildItemRow(item) {
            const tr = document.createElement('tr');
            tr.append(
                thumbCell(item.assetKey, item.name),
                textCell(item.name),
                textCell(item.themeName + (item.themeActive ? '' : ' (테마 비활성)')),
                textCell(item.categoryCode),
                textCell(item.placementType),
                textCell(priceLabel(item)),
                statusCell(item.active),
                toggleCell(item.active, () => updateActive('items', item.id, !item.active))
            );
            return tr;
        }

        function buildCharacterRow(character) {
            const tr = document.createElement('tr');
            tr.append(
                thumbCell(character.baseAssetKey, character.name),
                textCell(character.code),
                textCell(character.name),
                textCell(String(character.sortOrder)),
                statusCell(character.active),
                toggleCell(character.active, () => updateActive('characters', character.id, !character.active))
            );
            return tr;
        }

        function priceLabel(item) {
            if (!item.purchaseCurrencyType || item.priceAmount == null) return '뽑기 전용';
            return item.priceAmount + ' ' + item.purchaseCurrencyType;
        }

        function thumbCell(assetKey, alt) {
            const td = document.createElement('td');
            const img = document.createElement('img');
            img.className = 'slot-thumb';
            img.loading = 'lazy';
            img.src = assetUrl(assetKey);
            img.alt = alt;
            td.appendChild(img);
            return td;
        }

        function textCell(text) {
            const td = document.createElement('td');
            td.textContent = text ?? '-';
            return td;
        }

        function statusCell(active) {
            const td = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = 'item-badge';
            badge.textContent = active ? '사용 중' : '미사용';
            if (!active) badge.style.opacity = '.55';
            td.appendChild(badge);
            return td;
        }

        function toggleCell(active, onToggle) {
            const td = document.createElement('td');
            const button = document.createElement('button');
            button.type = 'button';
            button.className = active ? 'btn-ghost' : 'btn-primary';
            button.textContent = active ? '미사용으로' : '사용';
            button.addEventListener('click', async () => {
                button.disabled = true;
                try {
                    await onToggle();
                } finally {
                    button.disabled = false;
                }
            });
            td.appendChild(button);
            return td;
        }

        async function updateActive(kind, id, active) {
            hideError();
            try {
                const res = await fetch('/admin/catalog/' + kind + '/' + id + '/active', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                    body: JSON.stringify({ active })
                });
                if (!res.ok) {
                    throw new Error(await errorMessage(res));
                }
                const updated = await res.json();
                if (kind === 'items') {
                    items = items.map(item => item.id === updated.id ? updated : item);
                } else {
                    characters = characters.map(character => character.id === updated.id ? updated : character);
                }
                render();
            } catch (err) {
                showError('변경 실패: ' + err.message);
            }
        }

        function assetUrl(assetKey) {
            return s3BaseUrl.replace(/\/$/, '') + '/' + assetKey.replace(/^\//, '');
        }

        async function errorMessage(response) {
            try {
                const body = await response.json();
                return body.message || ('HTTP ' + response.status);
            } catch {
                return 'HTTP ' + response.status;
            }
        }

        function showError(message) {
            errorBox.textContent = message;
            errorBox.hidden = false;
        }

        function hideError() {
            errorBox.hidden = true;
        }
    </script>
</body>
</html>
